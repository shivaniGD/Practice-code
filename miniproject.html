<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav bar</title>
    <style>
        body{
            margin: 0;
            background-color: #f5f5f7;


        }
        nav{
            background-color: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 0;

        }
        .nav-content {
            width:90%;
            max-width: 1100px;
            display: flex; 
            justify-content: space-between;
            align-items: center;

        }
        .logo{
           font-size: 22px;
           font-weight: bold; 
           align-items:start;
        }
        .menu{
            display: flex;
            gap: 20px;

        }
        .menu a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
            letter-spacing: -0.4px;
            padding: 16px 0;

        }
        .menu a:hover{
            color: rgb(11, 99, 186);
        }
        .btn-blue{
            background-color: rgb(77, 77, 212);
            color: rgb(255, 255, 255);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-size: 14px ;
            
            
        }
        .btn-black{
             background-color: rgb(3, 3, 16);
            color: rgb(255, 255, 255);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-size: 14px ;
            
        }




    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <div class="logo">🍎</div>
            <div class="menu">
                <a href="" target="_blank" rel="noopener nonreferrer ">Store</a>
                <a href="" target="_blank" rel="noopener nonreferrer ">Iphone</a>
                <a href="" target="_blank" rel="noopener nonreferrer ">Mac Book</a>
                <a href="" target="_blank" rel="noopener nonreferrer ">Support</a>
                <a href="" target="_blank" rel="noopener nonreferrer ">Store</a>
            </div>
            <div class="buttons">
                <button class="btn-blue">Buy</button>
                <button class="btn-black">Login</button>
            </div>
            
        
        </div>
    </nav>
    
</body>
</html>
