<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="password" placeholder="enter the oass"><button>show</button>
</body>
<script>
    let btn=document.querySelector("button")
    let inputbtn=document.querySelector("input")

    btn.addEventListener("click", ()=>{
         if(btn.innerHTML=="show"){
            inputbtn.type="text"
            btn.innerHTML="hide"
         }
         else{
            inputbtn.type="password"
            btn.innerHTML="show"
         }
    })
</script> 
</html>
